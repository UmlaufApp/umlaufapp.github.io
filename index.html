<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Umlauf</title>
<style>
  :root {
    --background: #FBF7F6;
    --surface: #FFFFFF;
    --surface-alt: #EFE4E6;
    --separator: #EADFE2;
    --text-primary: #23181D;
    --text-secondary: #5C4B52;
    --text-tertiary: #877581;
    --accent: #6B2B4B;
    --link: #8E3A63;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #16131A;
      --surface: #211C27;
      --surface-alt: #2C2531;
      --separator: #302935;
      --text-primary: #F2ECEF;
      --text-secondary: #A99BA3;
      --text-tertiary: #8B7F87;
      --accent: #EFDCE5;
      --link: #E2A8C6;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 40rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
    color: var(--text-primary);
    background: var(--background);
    line-height: 1.6;
    font-size: 1rem;
    -webkit-text-size-adjust: 100%;
  }
  header { margin-bottom: 2.5rem; }
  .mark {
    width: 2.25rem; height: 2.25rem;
    border: 2.5px dashed var(--accent);
    border-radius: 50%;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-family: "New York", Georgia, "Times New Roman", serif;
    /* Wächst mit der Breite: „Datenschutzerklärung" sprengt sonst schmale Displays. */
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    font-weight: 600;
    margin: 0; letter-spacing: -0.01em;
    overflow-wrap: break-word; hyphens: auto;
  }
  .subtitle { color: var(--text-tertiary); font-size: 0.875rem; margin-top: 0.35rem; }
  h2 {
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin: 2.5rem 0 0.75rem;
  }
  p { margin: 0 0 1rem; color: var(--text-secondary); }
  .lead { color: var(--text-primary); font-size: 1.0625rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--separator);
    border-radius: 0.875rem;
    padding: 1rem 1.125rem;
    margin: 0 0 1rem;
  }
  .card p:last-child { margin-bottom: 0; }
  .card .who { color: var(--text-primary); }
  a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--separator); }
  a:hover { border-bottom-color: var(--link); }
  footer {
    margin-top: 3.5rem; padding-top: 1.25rem;
    border-top: 1px solid var(--separator);
    color: var(--text-tertiary); font-size: 0.8125rem;
  }
  footer a { color: var(--text-tertiary); }
</style>
</head>
<body>
<header>
  <div class="mark"></div>
  <h1>Umlauf</h1>
  <p class="subtitle">Ein Zyklustagebuch, das nur auf deinem iPhone läuft</p>
</header>

<p class="lead">Keine Konten, keine Werbung, kein Server. Deine Einträge verlassen das Gerät
nur, wenn du sie selbst exportierst.</p>

<h2>Rechtliches</h2>
<div class="card">
<p><a href="datenschutz.html">Datenschutzerklärung</a><br>
<a href="impressum.html">Impressum</a></p>
</div>

<footer>
  Kontakt: <a href="mailto:UmlaufApp@proton.me">UmlaufApp@proton.me</a>
</footer>
</body>
</html>
